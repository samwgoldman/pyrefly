name: "Test: Release artifacts (no publishing)"

# Builds everything a release would publish and keeps it as workflow artifacts:
# the wheels, the GitHub release archives, and the VS Code extension packages.
# It calls no publishing workflow and uses no secrets.

on:
  workflow_dispatch:
  # A workflow that is not on the default branch cannot be dispatched yet.
  push:
    branches: [ pgo-bolt-test ]

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/publish_build_packages.yml

  archives:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - run: python3 scripts/wheel_binaries.py archive dist archives
      - uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: archives

  extension:
    needs: wheels
    uses: ./.github/workflows/ci_extension_build.yml
    with:
      wheels: true
