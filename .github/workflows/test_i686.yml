name: "Test: i686 wheel (no publishing)"

# TEST ONLY: builds the i686 wheel the way publish_build_packages.yml does. Publishes nothing.

on:
  push:
    branches: [ i686-fix-test ]

permissions:
  contents: read

jobs:
  i686:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build wheels i686
        uses: PyO3/maturin-action@v1
        with:
          target: i686-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          working-directory: pyrefly
          # Docker 29's default seccomp profile makes socket creation fail for
          # 32-bit x86 programs, so the i686 container cannot resolve any host
          # (maturin-action installs libatomic with yum in it).
          docker-options: --security-opt seccomp=unconfined
        env:
          # The release profile sets debug = 1, which strip = "debuginfo" then
          # discards from the wheel. Dropping it shrinks the fat-LTO peak, which
          # otherwise runs out of memory on i686.
          CARGO_PROFILE_RELEASE_DEBUG: 0
      - name: Run the wheel in an i686 container
        run: |
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux2014_i686 bash -c '
            /opt/python/cp312-cp312/bin/python -m pip install --no-index pyrefly/dist/pyrefly-*.whl
            /opt/python/cp312-cp312/bin/pyrefly --version
            /opt/python/cp312-cp312/bin/pyrefly check test.py
          '
