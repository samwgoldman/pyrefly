name: "Debug: i686 container DNS"

# TEST ONLY: diagnoses DNS failures in 32-bit manylinux containers. Publishes nothing.

on:
  push:
    branches: [ i686-debug ]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        security: ["", "--security-opt seccomp=unconfined"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Host
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format '{{json .SecurityOptions}}'
      - name: Container
        run: |
          docker run --rm ${{ matrix.security }} quay.io/pypa/manylinux2014_i686 bash -c '
            grep -E "Seccomp|NoNewPrivs" /proc/self/status
            (exec 3<>/dev/tcp/140.82.114.4/443) && echo "tcp socket ok" || echo "tcp socket failed: $?"
            getent hosts github.com; echo "getent rc=$?"
            curl -sS -o /dev/null -w "vault http %{http_code}\n" https://vault.centos.org/
            yum -q makecache fast >/dev/null && echo "yum ok" || echo "yum failed"
            true
          '
